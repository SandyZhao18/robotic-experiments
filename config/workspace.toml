# Sketch-to-Structure workspace. All positions are in the `world` frame, in mm.
# z values are for the GRIPPER FRAME (what `uv run record-pose` prints), not the block.
#
# Status (2026-10-23): mat moved closer at ~14:00 and re-located from a whole-board view
# (locate-mat, 49 corners, gripper at 314,-392,600); square size and mat thickness
# measured with a ruler; grip_z from the hover test. Open question: the table z below
# disagrees with the camera by ~33 mm (see README) — grip_z does not depend on it.
calibrated = true
frame = "world"

[table]
z = -38.0                        # table top in world. Every height below is relative to this.

[mat]
# 8x8 chess mat, squares named from white's side: files a..h left to right, ranks 1..8 bottom to top.
# From `uv run locate-mat` (see config/mat_calibration.json / .jpg).
a1 = [134.5, -251.9]
h1 = [140.9, -650.2]
a8 = [531.5, -245.4]
square_size_mm = 57.0            # measured with a ruler; cross-checks the corners above
thickness_mm = 3.0               # measured; mat surface = table z + thickness
# Correction from placement trials, mm along [files a->h, ranks 1->8], added to where the
# arm is sent. Trial 1 (a1->a3, 2026-10-23): block landed 22.3 mm short along ranks.
# Mat moved and re-located from the overview pose: trial 5 landed +7.6 along ranks -> 14.7.
# Calibration runs A/B (trials 7-12, a3 c3 e3 a7 e7 c5) showed the error varies across the mat
# (~0.8 deg rotation, likely camera yaw), so it is now an offset plus a gradient:
#   `uv run fit-correction --since-trial 7 --exclude 8`  (trial 8: yellow cube twisted on c3)
# Part of this correction is camera calibration error, which depends on the pose locate-mat
# ran from; refit it whenever the mat is re-located.
# Taping the padless finger shifted placements +6.4 mm along ranks (trials 18-24, all in
# files a-c / ranks 3-5, too small an area for gradients), so only the offset was refit:
#   `uv run fit-correction --since-trial 18 --offset-only`   18.48 -> 12.11
placement_offset_mm = [0.0, 12.11]
placement_gradient = [[0.00294, 0.01232], [-0.01474, 0.00601]]

[grid]
# 3x3 build area. The design displays exactly as the board looks from white's side.
top_left = "a7"                  # square under design cell (row 0, col 0): a7 c7 e7 / a5 c5 e5 / a3 c3 e3
stride = 2                       # 2 = every other square, leaves room for the open fingers

[pickups]
# One block per square, used in this order. Must be outside the build grid and well spaced.
squares = ["a1", "c1", "e1", "g1", "g3"]

[block]
size_mm = 30.0                   # red cube, 30 x 30 x 30

[gripper]
# Measured gap / outer span: position 840 -> 92 / 113 mm, position 399 -> 48 / 70 mm, so
# gap ~= 0.1 mm per unit + 8 mm and each finger is ~11 mm thick. Open only part way so blocks
# can go on adjacent squares: position 360 -> ~44 mm gap (7 mm each side of a 30 mm cube).
# Releasing at 360 left the cube stuck to the finger that is missing its pad, twice (even after
# cleaning). The rubber part is now taped for less friction (2026-10-23); retrying partial release.
# To go back to fully open releases: delete open_position and set open_finger_span_mm = 113.0
open_position = 360.0            # used to RELEASE (~44 mm gap)
open_finger_span_mm = 66.0       # outer width across the fingers at open_position
full_open_span_mm = 113.0        # pickups open fully: tolerates ~30 mm of block offset
finger_clearance_mm = 8.0        # extra margin beside neighbouring blocks -> 56 mm minimum spacing
grip_z = 73.3                    # hover test: gripper z 150.3 with fingertips 82 mm above the mat
                                 # -> fingertips 5 mm above the mat = 150.3 - 82 + 5
approach_height_mm = 60.0        # above grip_z
place_release_offset_mm = 2.0    # above grip_z when letting go on the mat
travel_z = 200.0
theta_deg = -91.0                # gripper x-axis points at 180 - theta; files point at -89.0

[safe_start]
xyz = [285.0, -285.0, 340.0]     # camera then looks down on files a-e, ranks 1-8 (for check-placement)

[limits]
# Every target must fall inside this box.
min_xyz = [ 50.0, -720.0, -30.0]
max_xyz = [600.0, -150.0, 650.0]
required_obstacles = ["table", "wall-front", "wall-side", "ceiling"]
arrival_tolerance_mm = 5.0
